<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lógica em Jogo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      .hidden {
        display: none !important;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        text-align: center;
        pointer-events: none; /* clique atravessa até o canvas (pointer lock) */
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      #overlay h1 {
        margin: 0;
        font-size: 1.6rem;
      }
      #overlay p {
        margin: 0;
        font-size: 1rem;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.5;
        border-radius: 4px;
        z-index: 10;
      }
      #hud pre {
        margin: 0 0 6px;
        font: inherit;
        white-space: pre;
      }
      #hud button {
        font: inherit;
        padding: 2px 8px;
        cursor: pointer;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 22px;
        color: #fff;
        text-shadow: 0 0 3px #000;
        pointer-events: none;
        z-index: 5;
        user-select: none;
      }
      #hotbar {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        border-radius: 4px;
        pointer-events: none;
        max-width: min(920px, 92vw);
        text-align: center;
        line-height: 1.7;
        z-index: 5;
      }
      #hotbar span {
        white-space: nowrap;
        opacity: 0.85;
      }
      #hotbar b {
        white-space: nowrap;
        font-size: 13px;
      }
      #hotbar b {
        color: #ffd75e;
      }
      #chat {
        position: fixed;
        left: 12px;
        bottom: 48px;
        width: min(440px, 70vw);
        font-family: ui-monospace, monospace;
        font-size: 13px;
        color: #fff;
        z-index: 6;
        pointer-events: none; /* log não rouba clique do canvas */
      }
      #chat-log .msg {
        background: rgba(0, 0, 0, 0.45);
        padding: 2px 8px;
        margin-top: 2px;
        border-radius: 3px;
        overflow-wrap: break-word;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      #chat-log .msg.old {
        display: none; /* mensagem antiga some… */
      }
      #chat.open #chat-log .msg.old {
        display: block; /* …mas reaparece com o chat aberto */
      }
      #chat-input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 6px 8px;
        font: inherit;
        color: #fff;
        background: rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 3px;
        outline: none;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>Lógica em Jogo</h1>
      <p>Clique para jogar</p>
      <p>WASD move · mouse olha · espaço pula · Esc solta o mouse</p>
      <p>botão esquerdo quebra · direito coloca · 1–9 e scroll escolhem bloco · F3 desempenho</p>
      <p>Enter abre o chat (Esc fecha) · /bloco x y z id muda um bloco</p>
    </div>
    <div id="crosshair">+</div>
    <div id="chat">
      <div id="chat-log"></div>
      <input
        id="chat-input"
        class="hidden"
        type="text"
        autocomplete="off"
        placeholder="mensagem ou /bloco x y z id — Enter envia, Esc fecha"
      />
    </div>
    <div id="hotbar"></div>
    <div id="hud" class="hidden">
      <pre id="hud-text"></pre>
      <button id="hud-export" type="button">exportar JSON</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
